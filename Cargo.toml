[package]
name = "ldk-sample"
version = "0.1.0"
authors = ["Valentine Wallace <vwallace@protonmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# lightning = { version = "0.0.125", features = ["max_level_trace"] }
# lightning-block-sync = { version = "0.0.125", features = [
#     "rpc-client",
#     "tokio",
# ] }
# lightning-invoice = { version = "0.32.0" }
# lightning-net-tokio = { version = "0.0.125" }
# lightning-persister = { version = "0.0.125" }
# lightning-background-processor = { version = "0.0.125", features = ["futures"] }
# lightning-rapid-gossip-sync = { version = "0.0.125" }

# dependencies for defense
# maybenot = "2.0.1"
# once_cell = "1.16"
# rand_chacha = "0.3.1"
# thiserror = "1.0.57"
# log = "0.4"

# dependencies for defense-listener
maybenot = { path = "../../thesis/maybenot/crates/maybenot" }
event-listener = "5.3.1"
ringbuffer = "0.15.0"

lightning = { path = "../rust-lightning/lightning", features = [
    "max_level_trace",
] }
lightning-block-sync = { path = "../rust-lightning/lightning-block-sync", features = [
    "rpc-client",
    "tokio",
] }
lightning-invoice = { path = "../rust-lightning/lightning-invoice" }
lightning-net-tokio = { path = "../rust-lightning/lightning-net-tokio" }
lightning-persister = { path = "../rust-lightning/lightning-persister" }
lightning-background-processor = { path = "../rust-lightning/lightning-background-processor", features = [
    "futures",
] }
lightning-rapid-gossip-sync = { path = "../rust-lightning/lightning-rapid-gossip-sync" }

base64 = "0.13.0"
bitcoin = "0.32"
bitcoin-bech32 = "0.12"
bech32 = "0.8"
libc = "0.2"

chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8.5"
serde_json = { version = "1.0" }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
